name: Multi-City Hourly Feature Pipeline

on:
  schedule:
    - cron: '5 * * * *'  # Runs every hour at 5 mins past
  workflow_dispatch:

jobs:
  run-hourly-ingestion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install hopsworks==5.0.6 confluent-kafka==2.11.1 fastavro==1.12.0 openmeteo-requests requests-cache retry-requests pandas numpy python-dotenv

      - name: Ingest Multi-City Hourly Features to Hopsworks
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
        run: |
          python scripts/hopsworks_feature_pipeline.py
